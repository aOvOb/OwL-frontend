name: build and deploy admin

# The admin app (admin/index.html, admin.<domain>). Built from the shared src/ too, so a change there
# ships both apps; a change only to the admin app ships only this one.
on:
  push:
    branches: [main]
    paths:
      - "admin/**"
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vite.admin.config.ts"
      - ".github/workflows/deploy-admin.yml"
  pull_request:
    paths:
      - "admin/**"
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vite.admin.config.ts"
      - ".github/workflows/deploy-admin.yml"
  workflow_dispatch:

permissions:
  contents: write # push the release tag and create the GitHub Release after a successful deploy

concurrency:
  group: deploy-admin
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check and build
        run: npm run build:admin

      - name: Deploy (atomic switch)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The server only accepts "admin <commit>" (or backend/frontend) from this key; files on stdin.
          tar -C dist-admin -cz . | ssh -i ~/.ssh/deploy_key -o BatchMode=yes deploy@"$DEPLOY_HOST" "admin ${{ github.sha }}"

      - name: Remove key
        if: always()
        run: rm -f ~/.ssh/deploy_key

      # After a successful deploy: tag admin-vX.Y.Z (version from admin/version.json) and publish a GitHub Release
      # with that version's CHANGELOG section. Skipped when the tag already exists (no version bump).
      - name: Tag release
        if: success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="admin-v$(node -p "require('./admin/version.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/$V" >/dev/null; then
            echo "$V already tagged, nothing to release"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$V" -m "OwL admin $V"
          git push origin "$V"
          awk -v h="## ${V#admin-v} " 'index($0, h) == 1 {f = 1; next} /^## / && f {exit} f' admin/CHANGELOG.md > notes.md
          gh release create "$V" --title "OwL admin $V" --notes-file notes.md --verify-tag --latest=false
